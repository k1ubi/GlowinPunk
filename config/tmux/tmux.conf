# Cyberpunk/neon tmux config, tuned for kitty (xterm-kitty terminfo).

# --- terminal / truecolor ---
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"
set -sg escape-time 10
set -g focus-events on

# --- usability ---
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#T - #W"

# split shortcuts that keep the current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# fast, no-confirm close-pane (bound to prefix+X) — used by kitty's
# Win+d macro below. Default prefix+x (with confirmation) still works
# for manual use.
bind X kill-pane

# --- cyberpunk/neon palette ---
# black    #0a0a12   cyan   #00f0ff   magenta #ff2e97
# green    #05ffa1   yellow #f9f871   purple  #bd00ff

set -g status-style "bg=#0a0a12,fg=#d6f6ff"
set -g status-left-length 20
set -g status-left "#[fg=#0a0a12,bg=#00f0ff,bold] #S #[fg=#00f0ff,bg=#0a0a12]"
set -g status-right "#[fg=#ff2e97]#[fg=#0a0a12,bg=#ff2e97,bold] %H:%M #[fg=#bd00ff,bg=#ff2e97]#[fg=#0a0a12,bg=#bd00ff,bold] #h "

setw -g window-status-format " #[fg=#3a3a4a]#I:#W "
setw -g window-status-current-format " #[fg=#0a0a12,bg=#05ffa1,bold]#I:#W#F "

set -g pane-border-style "fg=#3a3a4a"
set -g pane-active-border-style "fg=#00f0ff"

set -g message-style "bg=#ff2e97,fg=#0a0a12,bold"
set -g message-command-style "bg=#bd00ff,fg=#0a0a12,bold"

set -g display-panes-colour "#3a3a4a"
set -g display-panes-active-colour "#00f0ff"

setw -g mode-style "bg=#00f0ff,fg=#0a0a12"
